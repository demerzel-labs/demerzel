name: PR

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  metadata:
    name: PR metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Fetch the current pull request metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr-metadata"
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr-metadata/pr.json"
          gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/commits?per_page=100" > "$RUNNER_TEMP/pr-metadata/commits.json"
      - name: Check the title, commits, and body
        run: >-
          python scripts/ci/check_pr.py
          --pr "$RUNNER_TEMP/pr-metadata/pr.json"
          --commits "$RUNNER_TEMP/pr-metadata/commits.json"
