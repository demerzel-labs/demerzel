name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Checkout needs read access and nothing here needs more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Backstop: a stalled runner or a wedged child process cannot
    # burn the six-hour job default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Update the stable toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Update the stable toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build the release binary
        run: cargo build --release --locked
      # The Layer-1 gate from docs/plan.md: the stripped release
      # binary stays under 25 MB. The release profile strips.
      - name: Check the binary size
        run: |
          limit=25000000
          size=$(wc -c < target/release/demerzel)
          echo "binary: ${size} bytes; gate: ${limit} bytes"
          test "$size" -lt "$limit"
