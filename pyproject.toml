[project]
name = "demerzel"
version = "0.1.0"
description = "Self-hosted agent harness with an observable, budgeted Strands runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "strands-agents>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[project.optional-dependencies]
# OTel export for the Strands runner; only needed when OTEL_EXPORTER_OTLP_ENDPOINT is set.
otel = ["opentelemetry-exporter-otlp>=1.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demerzel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
