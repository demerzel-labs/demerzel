[package]
name = "demerzel-providers"
description = "Provider trait and adapters for the Demerzel harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = { workspace = true }
demerzel-core = { workspace = true }
futures-core = { workspace = true }
getrandom = { workspace = true }
humantime = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time", "rt"] }

[dev-dependencies]
demerzel-mock = { workspace = true }
demerzel-tools = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
