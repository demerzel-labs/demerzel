[workspace]
resolver = "2"
members = [
    "crates/demerzel",
    "crates/demerzel-core",
    "crates/demerzel-mock",
    "crates/demerzel-providers",
    "crates/demerzel-tools",
    "crates/demerzel-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/demerzel-labs/demerzel"

[workspace.dependencies]
demerzel-core = { path = "crates/demerzel-core" }
demerzel-mock = { path = "crates/demerzel-mock" }
demerzel-providers = { path = "crates/demerzel-providers" }
demerzel-tools = { path = "crates/demerzel-tools" }
demerzel-tui = { path = "crates/demerzel-tui" }
axum = "0.8"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
criterion = { version = "0.7", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
futures-core = "0.3"
getrandom = "0.4"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
humantime = "2"
ignore = "0.4"
libc = "0.2"
log = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rustyline = { version = "18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = "1"
toml = { version = "1.1", default-features = false, features = ["parse", "display", "serde", "std"] }
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
