[workspace]
resolver = "2"
members = [
    "crates/demerzel",
    "crates/demerzel-core",
    "crates/demerzel-mock",
    "crates/demerzel-providers",
    "crates/demerzel-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/demerzel-labs/demerzel"

[workspace.dependencies]
demerzel-core = { path = "crates/demerzel-core" }
demerzel-mock = { path = "crates/demerzel-mock" }
demerzel-providers = { path = "crates/demerzel-providers" }
axum = "0.8"
base64 = "0.22"
futures-core = "0.3"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
humantime = "2"
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
