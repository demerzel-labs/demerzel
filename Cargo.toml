[workspace]
resolver = "2"
members = [
    "crates/demerzel",
    "crates/demerzel-core",
    "crates/demerzel-providers",
    "crates/demerzel-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/demerzel-labs/demerzel"

[workspace.dependencies]
demerzel-core = { path = "crates/demerzel-core" }
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
