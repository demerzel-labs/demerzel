# Prototype Review - Override Profiles (example)
#
# Maps repositories to override profiles and teams. Enable with PROTOTYPE_OVERRIDES=1.
# Repos not listed here get the default profile (no overrides). Paths are relative to
# the base-dir (repo root of this config repo).

# ---- repo profiles ----
[profile:base]
context = agents/profiles/base/review-context.md

[profile:acme-foundations]
extends = base
context = agents/profiles/acme-foundations/review-context.md

[profile:acme-platform-infrastructure]
extends = base
system_prompt = agents/profiles/acme-platform-infrastructure/system-prompt.md
context = agents/profiles/acme-platform-infrastructure/review-context.md
model = opus
effort = high

[repos]
acme/core = acme-foundations
acme/prod/data-layer = acme-foundations
acme/prod/search-server = acme-foundations
acme/prod/* = acme-platform-infrastructure

# ---- team profiles (additive: context + instructions + a bounded model pin) ----
[team:payments]
context = agents/teams/payments/review-context.md
instructions = Flag payment mutations lacking idempotency keys or audit logging.
model = opus

[team:data-platform]
context = agents/teams/data-platform/review-context.md
instructions = Flag migrations that lock large tables or lack a rollback path.

# ---- per-repo ownership maps (path glob -> team); explicit, wins over CODEOWNERS ----
[teams:acme/core]
src/payments/** = payments
db/migrations/** = data-platform

[teams:acme/prod/*]
**/liquibase/** = data-platform

# ---- CODEOWNERS ingestion (fills attribution where no explicit map matches) ----
[codeowners]
enabled = true
@acme/payments-team = payments
@acme/data-plat = data-platform
